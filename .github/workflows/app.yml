name: Application checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check code and documentation
        run: |
          npm run lint
          npm run typecheck
          npm run docs:lint
          git show --format= --check HEAD
      - name: Verify provider contracts and failures
        run: npm test
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Build production application
        run: npm run build

  browser:
    name: Desktop and mobile user flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          npm ci --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Verify production dashboard with fixtures
        run: npm run test:browser
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
